name: Auto Config Speed Checker

on:
  schedule:
    - cron: '0 2 * * *'   # هر روز ساعت 02:00 UTC
  workflow_dispatch:

jobs:
  test-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install unzip and wget
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget curl

      - name: Download xray-knife
        run: |
          curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest \
          | grep "browser_download_url.*linux-64.zip" \
          | cut -d : -f 2,3 \
          | tr -d '"' \
          | wget -qi - -O knife.zip

          unzip -o knife.zip

          if [ -f xray-knife-linux-64 ]; then
            mv xray-knife-linux-64 xray-knife
          fi

          chmod +x xray-knife
          ./xray-knife --help || true

      - name: Run Tester Script
        run: python tester.py

      - name: Show result stats
        run: |
          echo "alive count:"
          wc -l alive.txt || true
          echo "dead count:"
          wc -l dead.txt || true

      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add alive.txt dead.txt
          git diff --staged --quiet || git commit -m "update: refresh top speed configs [skip ci]"
          git push
