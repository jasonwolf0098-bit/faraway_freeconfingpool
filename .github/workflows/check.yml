name: Auto Config Speed Checker

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget curl

      - name: Download and Extract xray-knife
        run: |
          wget -O knife.zip https://github.com/lilendian0x00/xray-knife/releases/download/v11.0.0/xray-knife-linux-64.zip || \
          curl -L -o knife.zip https://github.com/lilendian0x00/xray-knife/releases/latest/download/xray-knife-linux-64.zip
          
          unzip -o knife.zip -d xray_extracted
          chmod +x xray_extracted/* || true
          
          # پیدا کردن خودکار فایل باینری و انتقال به پوشه اصلی
          find xray_extracted -name "xray-knife*" -type f -exec cp {} ./xray-knife \;
          chmod +x xray-knife
          ./xray-knife --help || true

      - name: Run Tester Script
        run: python tester.py

      - name: Show result stats
        run: |
          echo "--- STATS ---"
          echo "alive count:"
          wc -l alive.txt || true
          echo "dead count:"
          wc -l dead.txt || true

      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add alive.txt dead.txt
          git diff --staged --quiet || git commit -m "update: refresh top 400 speed configs [skip ci]"
          git push
