name: Auto Config Checker

on:
  schedule:
    - cron: '0 */12 * * *'  # هر ۱۲ ساعت یک‌بار خودکار اجرا می‌شود
  workflow_dispatch:        # دکمه برای اجرای دستی در هر لحظه

jobs:
  test-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # اجازه برای کامیت و پوش کردن تغییرات

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Xray-Knife Engine
        run: |
          curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest \
          | grep "browser_download_url.*linux-64.zip" \
          | cut -d : -f 2,3 \
          | tr -d \" \
          | wget -qi - -O knife.zip || true
          
          # اگر دانلود مستقیم ریلیز با مشکل مواجه شد، از فایل باینری عمومی لینوکس استفاده می‌کنیم
          if [ ! -f knife.zip ]; then
            wget -O knife.zip https://github.com/lilendian0x00/xray-knife/releases/download/v11.0.0/xray-knife-linux-64.zip
          fi
          
          unzip -o knife.zip
          chmod +x xray-knife || chmod +x xray-knife-linux-64 || true
          if [ -f xray-knife-linux-64 ]; then
            mv xray-knife-linux-64 xray-knife
          fi

      - name: Run Tester Script
        run: python tester.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add alive.txt dead.txt
          git diff --staged --quiet || git commit -m "update: refresh alive and dead configs [skip ci]"
          git push
